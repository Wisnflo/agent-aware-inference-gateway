[project]
name = "agent-gateway"
version = "0.1.0"
description = "Session-aware inference gateway for local llama.cpp backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "starlette>=0.37,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "prometheus-client>=0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "real_backend: requires a local llama-server binary and GGUF model",
]
addopts = "-ra"
